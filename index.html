<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abid Hussain — Mechanical Engineering Portfolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: rgba(11, 15, 25, 0.8);
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            background: #1f2937;
            padding: 8px 12px;
            border-radius: 6px;
        }

        nav a {
            color: #9ca3af;
            text-decoration: none;
            margin-left: 24px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #3b82f6;
        }

        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 100px 8%;
            min-height: 80vh;
            background: radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }

        .tag {
            color: #3b82f6;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }

        p {
            color: #9ca3af;
            max-width: 600px;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            gap: 16px;
        }

        .btn {
            background-color: #3b82f6;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
        }

        .btn-outline:hover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.05);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">AH.</div>
        <nav>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="tag">Mechanical Engineering — UET Peshawar</div>
        <h1>Abid Hussain</h1>
        <p>Mechanical Engineering student at UET Peshawar. Passionate about CAD design, engineering simulations, and building innovative tech solutions.</p>
        <div class="btn-container">
            <a href="#" class="btn">View Projects</a>
            <a href="#" class="btn btn-outline">Download CV</a>
        </div>
    </section>

</body>
</html>
